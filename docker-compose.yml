version: '3.8'
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quiz-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: backend
      SERVICE_TAGS: dev
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
    networks:
      - quiz-network

  nginx:
    image: nginx:alpine
    container_name: quiz-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - quiz-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    depends_on:
      - nginx
    networks:
      - quiz-network

  db:
    image: mysql:8
    container_name: quiz-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: quiz_db
      MYSQL_USER: user_quiz
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - quiz-db-data:/var/lib/mysql
    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge

volumes:
  quiz-db-data:
    driver: local